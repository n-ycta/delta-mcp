name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: tar -czf delta-mcp.tar.gz manifest.json package.json package-lock.json server LICENSE NOTICE
      - run: sha256sum delta-mcp.tar.gz > SHA256SUMS
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" delta-mcp.tar.gz SHA256SUMS --title "Delta Mcp $GITHUB_REF_NAME" --notes "Independent headless service. Requires Delta Core 0.4.3 or newer within 0.4.x. See the English README for migration, security boundaries and limitations."
